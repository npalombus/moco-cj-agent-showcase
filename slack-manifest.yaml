# Slack app manifest for the agent. At https://api.slack.com/apps choose "Create New App",
# "From an app manifest", pick your workspace and paste this file. Written from what the code
# uses (Socket Mode; app_mention and message events; chat.postMessage and files.uploadV2).
display_information:
  name: Jeffrey
  description: Answers questions about Montgomery County arrest records
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Jeffrey
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - files:write
      - im:history
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
